<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Algorithmic Background</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /* Canvas fills entire screen and stays behind everything */
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <script>
        let particles = [];
        let time = 0;

        function setup() {
            createCanvas(window.innerWidth, window.innerHeight);
            initializeParticles();
        }

        function initializeParticles() {
            particles = [];
            for (let i = 0; i < 80; i++) {
                particles.push({
                    x: random(width),
                    y: random(height),
                    vx: random(-1, 1),
                    vy: random(-1, 1),
                    size: random(1, 4),
                    hue: random(0, 360),
                    life: random(0.3, 1)
                });
            }
        }

        function draw() {
            background(15, 15, 20, 40);

            time += 0.01;

            // Update and draw particles
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];

                p.x += p.vx;
                p.y += p.vy;

                let offsetX = sin(time * 0.5 + i) * 0.5;
                let offsetY = cos(time * 0.5 + i) * 0.5;
                p.x += offsetX;
                p.y += offsetY;

                if (p.x < 0) p.x = width;
                if (p.x > width) p.x = 0;
                if (p.y < 0) p.y = height;
                if (p.y > height) p.y = 0;

                let hue = (p.hue + time * 20) % 360;
                let saturation = map(sin(time + i), -1, 1, 40, 100);
                let brightness = map(cos(time * 0.5 + i), -1, 1, 30, 80);

                colorMode(HSB);
                stroke(hue, saturation, brightness);
                strokeWeight(p.size);
                point(p.x, p.y);
            }

            // Draw flowing lines between nearby particles
            colorMode(HSB);
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    let p1 = particles[i];
                    let p2 = particles[j];

                    let dist = sqrt((p1.x - p2.x) ** 2 + (p1.y - p2.y) ** 2);

                    if (dist < 150) {
                        let alpha = map(dist, 0, 150, 80, 0);
                        let hue = (p1.hue + time * 20) % 360;
                        stroke(hue, 60, 60, alpha);
                        strokeWeight(0.5);
                        line(p1.x, p1.y, p2.x, p2.y);
                    }
                }
            }

            colorMode(RGB);
        }

        function windowResized() {
            if (window.innerWidth > 100 && window.innerHeight > 100) {
                resizeCanvas(window.innerWidth, window.innerHeight);
            }
        }
    </script>
</body>
</html>
